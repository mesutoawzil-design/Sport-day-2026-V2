<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจัดการและติดตามผลการแข่งขันกีฬาสี 2026 - โรงเรียนโกสัมพีวิทยา</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0055A5',
              blueDark: '#003B73',
              orange: '#FF6B00',
              orangeDark: '#C85200',
              orangeLight: '#FFF0E6'
            }
          },
          fontFamily: {
            sans: ['Sarabun', 'Prompt', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- React 18, ReactDOM, and Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons & HTML2PDF -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { font-family: 'Prompt', 'Sarabun', sans-serif; background-color: #F8FAFC; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #F1F5F9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-orange-500 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Google Apps Script Web App Endpoint URL (Google Sheets ID: 1orXaAGiTgG7xHaslaEf_H9On0eubN8JHfR21OQswLCo)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwD38weG3TQCxNcUAU6u5-ZF7YLvuKbmJsLkuDvb68oyvyntutyxolNH1l5arioswh55Q/exec";

    // Helper: Convert Google Drive Viewing Links into Direct Image Link URLs
    const formatDriveImageUrl = (url) => {
      if (!url) return '';
      if (url.includes('lh3.googleusercontent.com/d/')) return url;
      const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
      if (match && match[1]) {
        return `https://lh3.googleusercontent.com/d/${match[1]}`;
      }
      return url;
    };

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [isAdmin, setIsAdmin] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoading, setIsLoading] = useState(true);
      const [isSyncing, setIsSyncing] = useState(false);

      // Online Data States (Synced 100% with Google Sheets)
      const [matches, setMatches] = useState([]);
      const [medalData, setMedalData] = useState([
        { color: "สีฟ้า", gold: 0, silver: 0, bronze: 0 },
        { color: "สีแสด", gold: 0, silver: 0, bronze: 0 }
      ]);
      const [teachers, setTeachers] = useState([]);
      const [staffM5, setStaffM5] = useState([]);
      const [students, setStudents] = useState([]);
      const [albums, setAlbums] = useState([]);

      const [modalType, setModalType] = useState(null);
      const [editingItem, setEditingItem] = useState(null);

      // Initial Load from Google Sheets
      useEffect(() => {
        fetchOnlineData();
      }, []);

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // Fetch Real-time Online Data
      const fetchOnlineData = async () => {
        setIsSyncing(true);
        try {
          const res = await fetch(GOOGLE_SCRIPT_URL);
          const data = await res.json();

          if (data.Matches) setMatches(data.Matches);
          if (data.Medals && data.Medals.length > 0) {
            const formatted = data.Medals.map(m => ({
              color: m.color,
              gold: parseInt(m.gold || 0),
              silver: parseInt(m.silver || 0),
              bronze: parseInt(m.bronze || 0)
            }));
            setMedalData(formatted);
          }
          if (data.Teachers) setTeachers(data.Teachers);
          if (data.Staff) setStaffM5(data.Staff);
          if (data.Students) setStudents(data.Students);
          if (data.Albums) setAlbums(data.Albums);
        } catch (err) {
          console.error("Fetch Google Sheets Error:", err);
        } fontally: {
          setIsSyncing(false);
          setIsLoading(false);
        }
      };

      // Save Data to Google Sheets and Reload Real-time State
      const saveOnlineData = async (sheetName, updatedData) => {
        setIsSyncing(true);
        try {
          await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({ action: sheetName, data: updatedData })
          });
          await fetchOnlineData();
        } catch (err) {
          alert("เกิดข้อผิดพลาดในการบันทึกข้อมูลลง Google Sheets");
        } finally {
          setIsSyncing(false);
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (pinInput === '161616') {
          setIsAdmin(true); setLoginError(''); setPinInput('');
        } else {
          setLoginError('รหัสผ่าน PIN ไม่ถูกต้อง');
        }
      };

      const handleSaveItem = async (type, item) => {
        let updatedList = [];
        let sheetName = "";

        if (type === 'match') {
          sheetName = "Matches";
          const exists = matches.some(m => m.id === item.id);
          updatedList = exists ? matches.map(m => m.id === item.id ? item : m) : [...matches, item];
        } else if (type === 'medal') {
          sheetName = "Medals";
          updatedList = medalData.map(m => m.color === item.color ? item : m);
        } else if (type === 'teacher') {
          sheetName = "Teachers";
          const formatted = { ...item, photo: formatDriveImageUrl(item.photo) };
          const exists = teachers.some(t => t.id === item.id);
          updatedList = exists ? teachers.map(t => t.id === item.id ? formatted : t) : [...teachers, formatted];
        } else if (type === 'staff') {
          sheetName = "Staff";
          const formatted = { ...item, photo: formatDriveImageUrl(item.photo) };
          const exists = staffM5.some(s => s.id === item.id);
          updatedList = exists ? staffM5.map(s => s.id === item.id ? formatted : s) : [...staffM5, formatted];
        } else if (type === 'student') {
          sheetName = "Students";
          const formatted = { ...item, chartPhoto: formatDriveImageUrl(item.chartPhoto) };
          const exists = students.some(st => st.id === item.id);
          updatedList = exists ? students.map(st => st.id === item.id ? formatted : st) : [...students, formatted];
        } else if (type === 'album') {
          sheetName = "Albums";
          const formatted = { ...item, cover: formatDriveImageUrl(item.cover) };
          const exists = albums.some(a => a.id === item.id);
          updatedList = exists ? albums.map(a => a.id === item.id ? formatted : a) : [...albums, formatted];
        }

        setModalType(null);
        setEditingItem(null);
        if (sheetName) await saveOnlineData(sheetName, updatedList);
      };

      const handleDeleteItem = async (type, id) => {
        if (!confirm("ยืนยันการลบรายการนี้ใน Google Sheets?")) return;
        let updatedList = [];
        let sheetName = "";

        if (type === 'match') { sheetName = "Matches"; updatedList = matches.filter(m => m.id !== id); }
        else if (type === 'teacher') { sheetName = "Teachers"; updatedList = teachers.filter(t => t.id !== id); }
        else if (type === 'staff') { sheetName = "Staff"; updatedList = staffM5.filter(s => s.id !== id); }
        else if (type === 'student') { sheetName = "Students"; updatedList = students.filter(st => st.id !== id); }
        else if (type === 'album') { sheetName = "Albums"; updatedList = albums.filter(a => a.id !== id); }

        if (sheetName) await saveOnlineData(sheetName, updatedList);
      };

      const totalScoreBlue = useMemo(() => {
        const blue = medalData.find(m => m.color === 'สีฟ้า') || { gold: 0, silver: 0, bronze: 0 };
        return (blue.gold * 3) + (blue.silver * 2) + (blue.bronze * 1);
      }, [medalData]);

      const totalScoreOrange = useMemo(() => {
        const orange = medalData.find(m => m.color === 'สีแสด') || { gold: 0, silver: 0, bronze: 0 };
        return (orange.gold * 3) + (orange.silver * 2) + (orange.bronze * 1);
      }, [medalData]);

      const handlePrintPDF = () => {
        const element = document.getElementById('report-print-area');
        const opt = { margin: 10, filename: `รายงานกีฬาสี_2026.pdf`, html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4' } };
        if (window.html2pdf) window.html2pdf().set(opt).from(element).save();
        else window.print();
      };

      const handleExportCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
        csvContent += "ลำดับ,รายการกีฬา,ประเภท,วันเวลา,สถานที่,สถานะ,ผู้ชนะ,สกอร์\n";
        matches.forEach((m, idx) => { csvContent += `${idx + 1},${m.sport},${m.category},${m.time},${m.location},${m.status},${m.winner},${m.score}\n`; });
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `ตารางแข่งขัน_2026.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div class="min-h-screen flex flex-col justify-between">
          
          {/* Header Bar */}
          <header class="bg-gradient-to-r from-brand-blueDark via-brand-blue to-brand-orange text-white shadow-lg sticky top-0 z-40 no-print">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
              <div class="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                <div class="w-10 h-10 rounded-full bg-white text-brand-blue flex items-center justify-center font-bold text-lg shadow">🏆</div>
                <div>
                  <h1 class="text-base sm:text-lg font-bold leading-tight">ระบบจัดการและติดตามผลการแข่งขันกีฬาสี 2026</h1>
                  <p class="text-xs text-orange-200">โรงเรียนโกสัมพีวิทยา • Google Sheets Online Sync 100%</p>
                </div>
              </div>

              <div class="flex items-center space-x-3">
                <button onClick={fetchOnlineData} disabled={isSyncing} class="p-2 rounded bg-white/10 hover:bg-white/20 text-xs flex items-center space-x-1">
                  <i data-lucide="refresh-cw" class={`w-4 h-4 ${isSyncing ? 'animate-spin' : ''}`}></i>
                  <span class="hidden sm:inline">{isSyncing ? 'กำลังโหลด...' : 'ซิงค์ Google Sheets'}</span>
                </button>

                {isAdmin ? (
                  <span class="text-xs bg-green-500/20 px-3 py-1 rounded-full border border-green-400 font-medium">Admin Mode</span>
                ) : (
                  <button onClick={() => setActiveTab('admin')} class="bg-brand-orange hover:bg-brand-orangeDark px-3 py-1.5 rounded text-xs font-bold shadow">
                    เข้าสู่ระบบเจ้าหน้าที่
                  </button>
                )}
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav class="max-w-7xl mx-auto px-4 flex space-x-1 overflow-x-auto text-xs pb-1 custom-scrollbar">
              {[
                { id: 'home', label: '🏠 หน้าแรก' },
                { id: 'matches', label: '📅 ตารางแข่งขัน' },
                { id: 'results', label: '🏆 ผลการแข่งขัน' },
                { id: 'medals', label: '🥇 ตารางเหรียญ' },
                { id: 'albums', label: '📸 ภาพกิจกรรม' },
                { id: 'teachers', label: '🧑🏻‍🏫 คณะครู' },
                { id: 'staff', label: '🕺🏻 Staff ม.5' },
                { id: 'students', label: '😎 นักเรียน' },
                { id: 'reports', label: '📊 รายงาน PDF/CSV' },
                { id: 'admin', label: '🔒 Admin' }
              ].map(t => (
                <button key={t.id} onClick={() => setActiveTab(t.id)} class={`px-3 py-2 rounded-t font-semibold whitespace-nowrap ${activeTab === t.id ? 'bg-white text-brand-blue shadow' : 'text-white/80 hover:bg-white/10'}`}>
                  {t.label}
                </button>
              ))}
            </nav>
          </header>

          {/* Main Content Area */}
          <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

            {isLoading ? (
              <div class="text-center py-20 space-y-3">
                <div class="w-10 h-10 border-4 border-brand-orange border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-sm font-semibold text-slate-600">กำลังเชื่อมต่อข้อมูลออนไลน์จาก Google Sheets...</p>
              </div>
            ) : (
              <>
                {/* TAB 1: HOME */}
                {activeTab === 'home' && (
                  <div class="space-y-6">
                    <div class="bg-gradient-to-br from-brand-blueDark via-brand-blue to-slate-900 rounded-2xl p-6 text-white shadow-lg">
                      <h2 class="text-2xl font-extrabold">ระบบจัดการและติดตามผลการแข่งขันกีฬาสี 2026</h2>
                      <p class="text-xs text-blue-100 mt-1">โรงเรียนโกสัมพีวิทยา • คณะสีฟ้า 💙 และ คณะสีแสด 🧡</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div class="bg-gradient-to-br from-blue-600 to-blue-800 text-white rounded-2xl p-6 shadow-md">
                        <div class="flex justify-between items-start">
                          <div>
                            <span class="text-xs bg-white/20 px-2.5 py-0.5 rounded-full font-semibold">COLOR HOUSE</span>
                            <h3 class="text-2xl font-extrabold mt-1">คณะสีฟ้า 💙</h3>
                          </div>
                          <div class="text-right">
                            <span class="text-3xl font-black">{totalScoreBlue}</span>
                            <p class="text-xs text-blue-200">คะแนนรวม</p>
                          </div>
                        </div>
                        <div class="mt-4 grid grid-cols-3 gap-2 text-center bg-white/10 rounded-xl p-2.5 text-xs">
                          <div>🥇 ทอง: {medalData.find(m => m.color === 'สีฟ้า')?.gold || 0}</div>
                          <div>🥈 เงิน: {medalData.find(m => m.color === 'สีฟ้า')?.silver || 0}</div>
                          <div>🥉 ทองแดง: {medalData.find(m => m.color === 'สีฟ้า')?.bronze || 0}</div>
                        </div>
                      </div>

                      <div class="bg-gradient-to-br from-orange-500 to-orange-700 text-white rounded-2xl p-6 shadow-md">
                        <div class="flex justify-between items-start">
                          <div>
                            <span class="text-xs bg-white/20 px-2.5 py-0.5 rounded-full font-semibold">COLOR HOUSE</span>
                            <h3 class="text-2xl font-extrabold mt-1">คณะสีแสด 🧡</h3>
                          </div>
                          <div class="text-right">
                            <span class="text-3xl font-black">{totalScoreOrange}</span>
                            <p class="text-xs text-orange-200">คะแนนรวม</p>
                          </div>
                        </div>
                        <div class="mt-4 grid grid-cols-3 gap-2 text-center bg-white/10 rounded-xl p-2.5 text-xs">
                          <div>🥇 ทอง: {medalData.find(m => m.color === 'สีแสด')?.gold || 0}</div>
                          <div>🥈 เงิน: {medalData.find(m => m.color === 'สีแสด')?.silver || 0}</div>
                          <div>🥉 ทองแดง: {medalData.find(m => m.color === 'สีแสด')?.bronze || 0}</div>
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB 2: MATCHES */}
                {activeTab === 'matches' && (
                  <div class="space-y-4">
                    <div class="flex justify-between items-center">
                      <h2 class="text-lg font-bold text-slate-800">📅 ตารางการแข่งขันทั้งหมด</h2>
                      {isAdmin && (
                        <button onClick={() => { setEditingItem({ id: `M${Date.now()}`, sport: '', category: '', time: '', location: '', status: 'waiting', winner: '-', score: '-' }); setModalType('match'); }} class="bg-brand-orange text-white px-3 py-1.5 rounded text-xs font-bold shadow">
                          ➕ เพิ่มรายการแข่ง
                        </button>
                      )}
                    </div>

                    <div class="bg-white rounded-xl shadow border overflow-x-auto">
                      <table class="w-full text-left text-xs">
                        <thead class="bg-slate-100 border-b font-bold">
                          <tr>
                            <th class="p-3">กีฬา/ประเภท</th>
                            <th class="p-3">วัน-เวลา</th>
                            <th class="p-3">สนาม</th>
                            <th class="p-3">สถานะ</th>
                            <th class="p-3">ผลการแข่ง</th>
                            {isAdmin && <th class="p-3 text-center">จัดการ</th>}
                          </tr>
                        </thead>
                        <tbody class="divide-y">
                          {matches.length === 0 ? (
                            <tr><td colSpan="6" class="p-4 text-center text-slate-400">ยังไม่มีข้อมูลใน Google Sheets</td></tr>
                          ) : (
                            matches.map(m => (
                              <tr key={m.id} class="hover:bg-slate-50">
                                <td class="p-3 font-semibold">{m.sport} ({m.category})</td>
                                <td class="p-3 text-slate-600">{m.time}</td>
                                <td class="p-3 text-slate-600">{m.location}</td>
                                <td class="p-3">
                                  <span class={`px-2 py-0.5 rounded text-[10px] font-bold ${m.status==='live'?'bg-red-100 text-red-600 animate-pulse':m.status==='finished'?'bg-emerald-100 text-emerald-700':'bg-amber-100 text-amber-700'}`}>
                                    {m.status==='live'?'🔴 กำลังแข่ง':m.status==='finished'?'จบการแข่ง':'รอแข่ง'}
                                  </span>
                                </td>
                                <td class="p-3 font-medium">{m.score} {m.winner!=='-'&&`(${m.winner})`}</td>
                                {isAdmin && (
                                  <td class="p-3 text-center space-x-2">
                                    <button onClick={() => { setEditingItem(m); setModalType('match'); }} class="text-blue-600">✏️</button>
                                    <button onClick={() => handleDeleteItem('match', m.id)} class="text-red-600">🗑️</button>
                                  </td>
                                )}
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* TAB 3: RESULTS */}
                {activeTab === 'results' && (
                  <div class="space-y-4">
                    <h2 class="text-lg font-bold text-slate-800">🏆 อัปเดตผลการแข่งขันล่าสุด</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {matches.filter(m => m.status === 'finished' || m.status === 'live').map(m => (
                        <div key={m.id} class="bg-white rounded-xl p-4 shadow border space-y-2 text-xs">
                          <div class="flex justify-between font-bold border-b pb-2">
                            <span>{m.sport} ({m.category})</span>
                            <span class={m.status==='live'?'text-red-600 animate-pulse':'text-emerald-600'}>{m.status==='live'?'🔴 กำลังแข่ง':'จบการแข่งขัน'}</span>
                          </div>
                          <div class="flex justify-between text-center items-center py-2">
                            <div class={`flex-1 p-2 rounded ${m.winner==='สีฟ้า'?'bg-blue-100 font-bold border border-blue-400':''}`}>คณะสีฟ้า 💙</div>
                            <div class="px-4 font-bold text-base text-slate-700">{m.score}</div>
                            <div class={`flex-1 p-2 rounded ${m.winner==='สีแสด'?'bg-orange-100 font-bold border border-orange-400':''}`}>คณะสีแสด 🧡</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 4: MEDALS */}
                {activeTab === 'medals' && (
                  <div class="space-y-4">
                    <h2 class="text-lg font-bold text-slate-800">🥇 ตารางสรุปเหรียญรางวัล</h2>
                    <div class="bg-white rounded-xl shadow border overflow-x-auto">
                      <table class="w-full text-center text-xs">
                        <thead class="bg-slate-100 border-b font-bold">
                          <tr><th class="p-3 text-left">คณะสี</th><th class="p-3">🥇 ทอง (3)</th><th class="p-3">🥈 เงิน (2)</th><th class="p-3">🥉 ทองแดง (1)</th><th class="p-3">คะแนนรวม</th>{isAdmin && <th class="p-3">จัดการ</th>}</tr>
                        </thead>
                        <tbody class="divide-y font-semibold">
                          {medalData.map(m => (
                            <tr key={m.color}>
                              <td class="p-3 text-left font-bold">{m.color}</td>
                              <td class="p-3 text-yellow-600">{m.gold}</td>
                              <td class="p-3 text-slate-500">{m.silver}</td>
                              <td class="p-3 text-amber-700">{m.bronze}</td>
                              <td class="p-3 font-extrabold text-brand-blue text-sm">{(m.gold*3)+(m.silver*2)+(m.bronze*1)}</td>
                              {isAdmin && (
                                <td class="p-3">
                                  <button onClick={() => { setEditingItem(m); setModalType('medal'); }} class="bg-brand-blue text-white px-2 py-1 rounded text-[10px]">✏️ ปรับเหรียญ</button>
                                </td>
                              )}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* TAB 5: ALBUMS */}
                {activeTab === 'albums' && (
                  <div class="space-y-4">
                    <div class="flex justify-between items-center">
                      <h2 class="text-lg font-bold text-slate-800">📸 ภาพกิจกรรม & ลิงก์ Google Drive</h2>
                      {isAdmin && (
                        <button onClick={() => { setEditingItem({ id: `A${Date.now()}`, title: '', date: '', cover: '', driveUrl: '' }); setModalType('album'); }} class="bg-brand-orange text-white px-3 py-1.5 rounded text-xs font-bold shadow">
                          ➕ เพิ่มอัลบั้ม
                        </button>
                      )}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {albums.map(a => (
                        <div key={a.id} class="bg-white rounded-xl shadow border overflow-hidden flex flex-col justify-between">
                          <div class="h-40 bg-slate-100 relative">
                            {a.cover ? <img src={formatDriveImageUrl(a.cover)} alt={a.title} class="w-full h-full object-cover" /> : <div class="w-full h-full flex items-center justify-center text-slate-300 text-2xl">🖼️</div>}
                          </div>
                          <div class="p-3"><h3 class="font-bold text-xs">{a.title}</h3></div>
                          <div class="p-3 bg-slate-50 border-t flex justify-between items-center">
                            <a href={a.driveUrl} target="_blank" rel="noopener noreferrer" class="text-xs bg-brand-orange text-white px-2.5 py-1 rounded font-semibold shadow">📂 เปิด Google Drive</a>
                            {isAdmin && (
                              <div class="space-x-1">
                                <button onClick={() => { setEditingItem(a); setModalType('album'); }} class="text-xs text-blue-600">✏️</button>
                                <button onClick={() => handleDeleteItem('album', a.id)} class="text-xs text-red-600">🗑️</button>
                              </div>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 6: TEACHERS */}
                {activeTab === 'teachers' && (
                  <div class="space-y-4">
                    <div class="flex justify-between items-center">
                      <h2 class="text-lg font-bold text-slate-800">🧑🏻‍🏫 รายชื่อคุณครูและคณะกรรมการ</h2>
                      {isAdmin && (
                        <button onClick={() => { setEditingItem({ id: `T${Date.now()}`, name: '', position: '', group: 'คณะกรรมการกลาง', photo: '', phone: '' }); setModalType('teacher'); }} class="bg-brand-orange text-white px-3 py-1.5 rounded text-xs font-bold shadow">
                          ➕ เพิ่มครู
                        </button>
                      )}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                      {teachers.map(t => (
                        <div key={t.id} class="bg-white rounded-xl p-3 shadow border flex items-center space-x-3">
                          <div class="w-14 h-14 rounded-full bg-slate-100 overflow-hidden flex-shrink-0 border">
                            {t.photo ? <img src={formatDriveImageUrl(t.photo)} alt={t.name} class="w-full h-full object-cover" /> : <div class="w-full h-full flex items-center justify-center text-xl">👤</div>}
                          </div>
                          <div class="flex-grow min-w-0 text-xs">
                            <h4 class="font-bold truncate">{t.name}</h4>
                            <p class="text-slate-500 truncate">{t.position}</p>
                            <p class="text-brand-orange mt-0.5">📞 {t.phone||'-'}</p>
                          </div>
                          {isAdmin && (
                            <div class="flex flex-col space-y-1">
                              <button onClick={() => { setEditingItem(t); setModalType('teacher'); }} class="text-xs text-blue-600">✏️</button>
                              <button onClick={() => handleDeleteItem('teacher', t.id)} class="text-xs text-red-600">🗑️</button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 7: STAFF */}
                {activeTab === 'staff' && (
                  <div class="space-y-4">
                    <div class="flex justify-between items-center">
                      <h2 class="text-lg font-bold text-slate-800">🕺🏻 Staff ม.5</h2>
                      {isAdmin && (
                        <button onClick={() => { setEditingItem({ id: `ST${Date.now()}`, name: '', room: 'ม.5/1', color: 'สีฟ้า', photo: '' }); setModalType('staff'); }} class="bg-brand-orange text-white px-3 py-1.5 rounded text-xs font-bold shadow">
                          ➕ เพิ่ม Staff
                        </button>
                      )}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                      {staffM5.map(s => (
                        <div key={s.id} class="bg-white rounded-xl p-3 shadow border flex items-center space-x-3">
                          <div class="w-14 h-14 rounded-xl bg-slate-100 overflow-hidden flex-shrink-0 border">
                            {s.photo ? <img src={formatDriveImageUrl(s.photo)} alt={s.name} class="w-full h-full object-cover" /> : <div class="w-full h-full flex items-center justify-center text-xl">🕺🏻</div>}
                          </div>
                          <div class="flex-grow min-w-0 text-xs">
                            <span class={`text-[10px] px-2 py-0.5 rounded font-bold ${s.color==='สีฟ้า'?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}`}>{s.color}</span>
                            <h4 class="font-bold truncate mt-1">{s.name}</h4>
                            <p class="text-slate-500">ห้อง {s.room}</p>
                          </div>
                          {isAdmin && (
                            <div class="flex flex-col space-y-1">
                              <button onClick={() => { setEditingItem(s); setModalType('staff'); }} class="text-xs text-blue-600">✏️</button>
                              <button onClick={() => handleDeleteItem('staff', s.id)} class="text-xs text-red-600">🗑️</button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 8: STUDENTS */}
                {activeTab === 'students' && (
                  <div class="space-y-4">
                    <div class="flex justify-between items-center">
                      <h2 class="text-lg font-bold text-slate-800">😎 ผังนักเรียนแยกตามห้อง</h2>
                      {isAdmin && (
                        <button onClick={() => { setEditingItem({ id: `S${Date.now()}`, room: 'ม.1/1', color: 'สีฟ้า', chartPhoto: '' }); setModalType('student'); }} class="bg-brand-orange text-white px-3 py-1.5 rounded text-xs font-bold shadow">
                          ➕ เพิ่มผังห้อง
                        </button>
                      )}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                      {students.map(st => (
                        <div key={st.id} class="bg-white rounded-xl shadow border p-3 space-y-2">
                          <div class="flex justify-between items-center border-b pb-1">
                            <span class="font-bold text-xs">ห้อง {st.room}</span>
                            <span class={`text-[10px] px-2 py-0.5 rounded font-bold ${st.color==='สีฟ้า'?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}`}>{st.color}</span>
                          </div>
                          <div class="h-40 bg-slate-100 rounded overflow-hidden flex items-center justify-center">
                            {st.chartPhoto ? <img src={formatDriveImageUrl(st.chartPhoto)} alt={st.room} class="w-full h-full object-cover" /> : <span class="text-xs text-slate-400">ไม่มีรูปผัง</span>}
                          </div>
                          {isAdmin && (
                            <div class="flex justify-end space-x-2 pt-1 border-t">
                              <button onClick={() => { setEditingItem(st); setModalType('student'); }} class="text-xs text-blue-600">✏️</button>
                              <button onClick={() => handleDeleteItem('student', st.id)} class="text-xs text-red-600">🗑️</button>
                            </div>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* TAB 9: REPORTS */}
                {activeTab === 'reports' && (
                  <div class="space-y-4">
                    <div class="flex justify-between items-center no-print">
                      <h2 class="text-lg font-bold text-slate-800">📊 สรุปผล & พิมพ์รายงาน</h2>
                      <div class="space-x-2">
                        <button onClick={handleExportCSV} class="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-semibold shadow">📄 CSV</button>
                        <button onClick={handlePrintPDF} class="bg-brand-blue text-white px-3 py-1.5 rounded text-xs font-semibold shadow">🖨️ PDF</button>
                      </div>
                    </div>
                    <div id="report-print-area" class="bg-white rounded-xl p-6 shadow border space-y-4">
                      <div class="text-center border-b pb-3">
                        <h1 class="text-xl font-bold">รายงานสรุปผลการแข่งขันกีฬาสี 2026</h1>
                        <p class="text-xs text-slate-500">โรงเรียนโกสัมพีวิทยา</p>
                      </div>
                      <div class="space-y-2">
                        <h3 class="font-bold text-xs">🥇 สรุปตารางเหรียญรางวัล</h3>
                        <table class="w-full text-center text-xs border">
                          <thead class="bg-slate-100 border-b">
                            <tr><th class="p-1 text-left">คณะสี</th><th class="p-1">ทอง</th><th class="p-1">เงิน</th><th class="p-1">ทองแดง</th><th class="p-1">คะแนน</th></tr>
                          </thead>
                          <tbody>
                            {medalData.map(m => (
                              <tr key={m.color} class="border-b">
                                <td class="p-1 text-left font-bold">{m.color}</td>
                                <td class="p-1">{m.gold}</td><td class="p-1">{m.silver}</td><td class="p-1">{m.bronze}</td>
                                <td class="p-1 font-bold text-brand-blue">{(m.gold*3)+(m.silver*2)+(m.bronze*1)}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* TAB 10: ADMIN PORTAL */}
                {activeTab === 'admin' && (
                  <div class="max-w-md mx-auto my-10 bg-white rounded-xl p-6 shadow border">
                    {!isAdmin ? (
                      <form onSubmit={handleLogin} class="space-y-4">
                        <h2 class="text-base font-bold text-center">🔒 เข้าสู่ระบบแอดมิน</h2>
                        {loginError && <p class="text-xs text-red-600 text-center">{loginError}</p>}
                        <input type="password" maxLength="6" placeholder="••••••" value={pinInput} onChange={e => setPinInput(e.target.value)} class="w-full text-center text-2xl p-2 border rounded tracking-widest" />
                        <button type="submit" class="w-full bg-brand-orange text-white py-2 rounded font-bold text-xs shadow">เข้าสู่ระบบ</button>
                      </form>
                    ) : (
                      <div class="text-center space-y-3">
                        <p class="text-green-600 font-bold text-xs">✅ ท่านอยู่ในสถานะแอดมิน (เชื่อม Google Sheets สด)</p>
                        <button onClick={() => setIsAdmin(false)} class="bg-slate-200 text-slate-700 px-3 py-1.5 rounded text-xs font-bold">ออกจากระบบ</button>
                      </div>
                    )}
                  </div>
                )}
              </>
            )}

          </main>

          {/* EDIT MODAL POPUP */}
          {modalType && editingItem && (
            <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
              <div class="bg-white rounded-xl max-w-md w-full p-5 shadow-xl space-y-3 text-xs">
                <h3 class="font-bold border-b pb-2 text-sm">✏️ แก้ไขข้อมูล (บันทึกลง Google Sheets)</h3>

                {modalType === 'match' && (
                  <>
                    <div><label class="font-bold">กีฬา</label><input type="text" value={editingItem.sport} onChange={e => setEditingItem({...editingItem, sport: e.target.value})} class="w-full p-1.5 border rounded mt-0.5"/></div>
                    <div><label class="font-bold">ประเภท</label><input type="text" value={editingItem.category} onChange={e => setEditingItem({...editingItem, category: e.target.value})} class="w-full p-1.5 border rounded mt-0.5"/></div>
                    <div><label class="font-bold">วัน-เวลา</label><input type="text" value={editingItem.time} onChange={e => setEditingItem({...editingItem, time: e.target.value})} class="w-full p-1.5 border rounded mt-0.5"/></div>
                    <div><label class="font-bold">สถานที่</label><input type="text" value={editingItem.location} onChange={e => setEditingItem({...editingItem, location: e.target.value})} class="w-full p-1.5 border rounded mt-0.5"/></div>
                    <div>
                      <label class="font-bold">สถานะ</label>
                      <select value={editingItem.status} onChange={e => setEditingItem({...editingItem, status: e.target.value})} class="w-full p-1.5 border rounded mt-0.5">
                        <option value="waiting">รอแข่งขัน</option>
                        <option value="live">กำลังแข่งขัน</option>
                        <option value="finished">แข่งเสร็จสิ้น</option>
                      </select>
                    </div>
                    <div>
                      <label class="font-bold">ผู้ชนะ</label>
                      <select value={editingItem.winner} onChange={e => setEditingItem({...editingItem, winner: e.target.value})} class="w-full p-1.5 border rounded mt-0.5">
                        <option value="-">-</option>
                        <option value="สีฟ้า">สีฟ้า</option>
                        <option value="สีแสด">สีแสด</option>
                      </select>
                    </div>
                    <div><label class="font-bold">สกอร์</label><input type="text" value={editingItem.score} onChange={e => setEditingItem({...editingItem, score: e.target.value})} class="w-full p-1.5 border rounded mt-0.5"/></div>
                  </>
                )}

                {modalType === 'medal' && (
                  <>
                    <div><label class="font-bold">🥇 ทอง</label><input type="number" value={editingItem.gold} onChange={e => setEditingItem({...editingItem, gold: parseInt(e.target.value)||0})} class="w-full p-1.5 border rounded mt-0.5"/></div>
                    <div><label class="font-bold">🥈 เงิน</label><input type="number" value={editingItem.silver} onChange={e => setEditingItem({...editingItem, silver: parseInt(e.target.value)||0})} class="w-full p-1.5 border rounded mt-0.5"/></div>
                    <div><label class="font-bold">🥉 ทองแดง</label><input type="number" value={editingItem.bronze} onChange={e => setEditingItem({...editingItem, bronze: parseInt(e.target.value)||0})} class="w-full p-1.5 border rounded mt-0.5"/></div>
                  </>
                )}

                {(modalType === 'teacher' || modalType === 'staff' || modalType === 'student' || modalType === 'album') && (
                  <>
                    {modalType === 'teacher' && <div><label class="font-bold">ชื่อ-นามสกุล</label><input type="text" value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} class="w-full p-1.5 border rounded mt-0.5"/></div>}
                    {modalType === 'staff' && <div><label class="font-bold">ชื่อ Staff</label><input type="text" value={editingItem.name} onChange={e => setEditingItem({...editingItem, name: e.target.value})} class="w-full p-1.5 border rounded mt-0.5"/></div>}
                    {modalType === 'student' && <div><label class="font-bold">ห้องเรียน</label><input type="text" value={editingItem.room} onChange={e => setEditingItem({...editingItem, room: e.target.value})} class="w-full p-1.5 border rounded mt-0.5"/></div>}
                    {modalType === 'album' && <div><label class="font-bold">ชื่ออัลบั้ม</label><input type="text" value={editingItem.title} onChange={e => setEditingItem({...editingItem, title: e.target.value})} class="w-full p-1.5 border rounded mt-0.5"/></div>}

                    <div>
                      <label class="font-bold">วางลิงก์รูปภาพ Google Drive</label>
                      <input 
                        type="text" 
                        value={modalType==='student'?editingItem.chartPhoto:modalType==='album'?editingItem.cover:editingItem.photo} 
                        onChange={e => {
                          const val = e.target.value;
                          if (modalType==='student') setEditingItem({...editingItem, chartPhoto: val});
                          else if (modalType==='album') setEditingItem({...editingItem, cover: val});
                          else setEditingItem({...editingItem, photo: val});
                        }} 
                        class="w-full p-1.5 border rounded mt-0.5" 
                        placeholder="วางลิงก์ Google Drive"
                      />
                    </div>
                  </>
                )}

                <div class="flex justify-end space-x-2 border-t pt-2">
                  <button onClick={() => { setModalType(null); setEditingItem(null); }} class="px-3 py-1 bg-slate-200 rounded font-bold">ยกเลิก</button>
                  <button onClick={() => handleSaveItem(modalType, editingItem)} class="px-3 py-1 bg-brand-orange text-white rounded font-bold shadow">บันทึกสดลง Google Sheets</button>
                </div>
              </div>
            </div>
          )}

          <footer class="bg-slate-900 text-slate-400 py-4 text-center text-xs border-t no-print mt-8">
            <p>© 2026 โรงเรียนโกสัมพีวิทยา • Sports Day Management System (Google Sheets API 100%)</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
